# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      fuzz-time: 10s
      coverage-min: "85"
      codecov-name: bacnetctl
      go-versions: '["1.26", "1.27"]'
      # Test the cmd packages as well (the shared default skips /cmd) and attribute
      # coverage across the whole module, matching `make coverage`.
      test-exclude-regex: "/example(s)?($|/)"
      coverpkg: ./...
    secrets: inherit

  # The shared workflow gates the total; this job gates each package.
  coverage-floor:
    name: Per-package coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check

  # The tests on a 32-bit platform, where int has 32 bits (linux/arm/v7 is a released
  # target). linux/386 runs natively on the runner; the race detector does not exist there.
  test-386:
    name: Tests on linux/386
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet and test as linux/386
        env:
          GOARCH: "386"
        run: |
          go vet ./...
          go test -count=1 ./...

  # The e2e suite (//go:build e2e) runs the built binary: main, signals and exit codes.
  e2e:
    name: End-to-end tests of the built binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make e2e
